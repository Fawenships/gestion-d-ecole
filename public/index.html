<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Gestion École</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: Arial, sans-serif;
            background: #f4f6f8;
        }

        .box {
            background: white;
            padding: 40px;
            border-radius: 16px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,.08);
        }

        h1 {
            margin-bottom: 10px;
        }

        p {
            color: #666;
        }
    </style>
</head>

<body>

    <div class="box">
        <h1>Gestion École</h1>
        <p>La plateforme scolaire fonctionne.</p>
    </div>

</body>
</html>

<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Gestion École — Connexion</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            min-height: 100vh;
            background: #f4f7fb;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #172033;
        }

        .login-container {
            width: 100%;
            max-width: 430px;
            padding: 20px;
        }

        .login-card {
            background: #ffffff;
            border-radius: 18px;
            padding: 40px 35px;
            box-shadow: 0 15px 45px rgba(0, 0, 0, 0.08);
        }

        .logo {
            width: 65px;
            height: 65px;
            margin: 0 auto 20px;
            border-radius: 16px;
            background: #1d4ed8;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 25px;
            font-weight: bold;
        }

        h1 {
            text-align: center;
            font-size: 27px;
            margin-bottom: 8px;
        }

        .subtitle {
            text-align: center;
            color: #687386;
            margin-bottom: 30px;
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 8px;
        }

        input {
            width: 100%;
            height: 48px;
            padding: 0 14px;
            border: 1px solid #d8dee8;
            border-radius: 9px;
            outline: none;
            font-size: 15px;
            transition: .2s;
        }

        input:focus {
            border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, .10);
        }

        button {
            width: 100%;
            height: 49px;
            border: none;
            border-radius: 9px;
            background: #1d4ed8;
            color: white;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            transition: .2s;
        }

        button:hover {
            background: #1e40af;
        }

        button:disabled {
            opacity: .6;
            cursor: not-allowed;
        }

        .message {
            display: none;
            padding: 12px;
            margin-bottom: 18px;
            border-radius: 8px;
            font-size: 14px;
            text-align: center;
        }

        .message.error {
            display: block;
            background: #fee2e2;
            color: #991b1b;
        }

        .message.success {
            display: block;
            background: #dcfce7;
            color: #166534;
        }

        .footer {
            text-align: center;
            color: #8992a3;
            font-size: 12px;
            margin-top: 25px;
        }

        @media (max-width: 480px) {
            .login-card {
                padding: 30px 22px;
            }
        }
    </style>
</head>

<body>

<div class="login-container">

    <div class="login-card">

        <div class="logo">GE</div>

        <h1>Gestion École</h1>

        <p class="subtitle">
            Administration et gestion scolaire
        </p>

        <div id="message" class="message"></div>

        <form id="loginForm">

            <div class="form-group">
                <label for="email">Adresse e-mail</label>

                <input
                    type="email"
                    id="email"
                    placeholder="administrateur@ecole.com"
                    required
                >
            </div>

            <div class="form-group">
                <label for="password">Mot de passe</label>

                <input
                    type="password"
                    id="password"
                    placeholder="Votre mot de passe"
                    required
                >
            </div>

            <button type="submit" id="loginButton">
                Se connecter
            </button>

        </form>

        <div class="footer">
            Plateforme de gestion scolaire
        </div>

    </div>

</div>

<script>

const form = document.getElementById("loginForm");
const button = document.getElementById("loginButton");
const message = document.getElementById("message");

function showMessage(text, type) {
    message.textContent = text;
    message.className = "message " + type;
}

form.addEventListener("submit", async function(event) {

    event.preventDefault();

    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;

    button.disabled = true;
    button.textContent = "Connexion...";

    message.className = "message";
    message.textContent = "";

    try {

        const response = await fetch("/api/login", {

            method: "POST",

            headers: {
                "Content-Type": "application/json"
            },

            body: JSON.stringify({
                email,
                password
            })

        });

        const data = await response.json();

        if (!response.ok || !data.success) {

            showMessage(
                data.message || "Impossible de se connecter.",
                "error"
            );

            button.disabled = false;
            button.textContent = "Se connecter";

            return;
        }

        localStorage.setItem("school_token", data.token);
        localStorage.setItem(
            "school_user",
            JSON.stringify(data.user)
        );

        showMessage(
            "Connexion réussie. Redirection...",
            "success"
        );

        setTimeout(() => {
            window.location.href = "/admin.html";
        }, 600);

    } catch (error) {

        console.error(error);

        showMessage(
            "Impossible de contacter le serveur.",
            "error"
        );

        button.disabled = false;
        button.textContent = "Se connecter";
    }

});

</script>

</body>
</html>

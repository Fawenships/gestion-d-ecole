<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Connexion — Gestion École</title>

    <meta
        name="description"
        content="Connexion à la plateforme de gestion scolaire."
    >

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            font-family: Arial, Helvetica, sans-serif;
            background:
                linear-gradient(
                    135deg,
                    #0f172a 0%,
                    #172554 50%,
                    #1e3a8a 100%
                );
            display: flex;
            align-items: center;
            justify-content: center;
            color: #172033;
        }

        .page {
            width: 100%;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 25px;
        }

        .login-card {
            width: 100%;
            max-width: 430px;
            background: #ffffff;
            border-radius: 16px;
            padding: 42px;
            box-shadow: 0 25px 70px rgba(0, 0, 0, 0.25);
        }

        .brand {
            text-align: center;
            margin-bottom: 35px;
        }

        .brand-icon {
            width: 64px;
            height: 64px;
            margin: 0 auto 18px;
            border-radius: 14px;
            background: #2563eb;
            color: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 25px;
            font-weight: bold;
        }

        .brand h1 {
            font-size: 28px;
            color: #111827;
            margin-bottom: 8px;
        }

        .brand p {
            color: #667085;
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 21px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #344054;
            font-size: 14px;
            font-weight: 600;
        }

        .input-wrapper {
            position: relative;
        }

        .input-wrapper input {
            width: 100%;
            height: 50px;
            padding: 0 15px;
            border: 1px solid #d0d5dd;
            border-radius: 8px;
            outline: none;
            font-size: 15px;
            color: #101828;
            background: #ffffff;
            transition: 0.2s;
        }

        .input-wrapper input:focus {
            border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.10);
        }

        .input-wrapper input::placeholder {
            color: #98a2b3;
        }

        .login-button {
            width: 100%;
            height: 50px;
            border: none;
            border-radius: 8px;
            background: #2563eb;
            color: #ffffff;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.2s;
            margin-top: 5px;
        }

        .login-button:hover {
            background: #1d4ed8;
        }

        .login-button:active {
            transform: translateY(1px);
        }

        .login-button:disabled {
            opacity: 0.65;
            cursor: not-allowed;
            transform: none;
        }

        .message {
            display: none;
            margin-top: 18px;
            padding: 13px 15px;
            border-radius: 8px;
            font-size: 14px;
            line-height: 1.5;
        }

        .message.error {
            display: block;
            background: #fef3f2;
            border: 1px solid #fecdca;
            color: #b42318;
        }

        .message.success {
            display: block;
            background: #ecfdf3;
            border: 1px solid #abefc6;
            color: #067647;
        }

        .footer {
            text-align: center;
            margin-top: 28px;
            color: #98a2b3;
            font-size: 12px;
        }

        .loading {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .spinner {
            width: 15px;
            height: 15px;
            border: 2px solid rgba(255,255,255,0.4);
            border-top-color: #ffffff;
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        @media (max-width: 500px) {

            .page {
                padding: 15px;
            }

            .login-card {
                padding: 30px 24px;
                border-radius: 13px;
            }

            .brand h1 {
                font-size: 25px;
            }
        }
    </style>
</head>

<body>

<div class="page">

    <main class="login-card">

        <div class="brand">

            <div class="brand-icon">
                GE
            </div>

            <h1>Gestion École</h1>

            <p>
                Connectez-vous à votre espace d'administration
            </p>

        </div>


        <form id="loginForm">

            <div class="form-group">

                <label for="email">
                    Adresse e-mail
                </label>

                <div class="input-wrapper">

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="admin@mon-ecole.ht"
                        autocomplete="email"
                        required
                    >

                </div>

            </div>


            <div class="form-group">

                <label for="password">
                    Mot de passe
                </label>

                <div class="input-wrapper">

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Votre mot de passe"
                        autocomplete="current-password"
                        required
                    >

                </div>

            </div>


            <button
                type="submit"
                class="login-button"
                id="loginButton"
            >
                Se connecter
            </button>


            <div
                id="message"
                class="message"
            ></div>

        </form>


        <div class="footer">
            Système de gestion scolaire
        </div>

    </main>

</div>


<script>

const loginForm = document.getElementById("loginForm");

const loginButton = document.getElementById("loginButton");

const message = document.getElementById("message");


/*
==================================================
AFFICHER UN MESSAGE
==================================================
*/

function showMessage(text, type) {

    message.textContent = text;

    message.className = "message " + type;

}


/*
==================================================
CACHER LE MESSAGE
==================================================
*/

function hideMessage() {

    message.textContent = "";

    message.className = "message";

}


/*
==================================================
CONNEXION
==================================================
*/

loginForm.addEventListener("submit", async function(event) {

    event.preventDefault();

    hideMessage();

    const email =
        document.getElementById("email").value.trim();

    const password =
        document.getElementById("password").value;


    if (!email || !password) {

        showMessage(
            "Veuillez remplir tous les champs.",
            "error"
        );

        return;
    }


    loginButton.disabled = true;

    loginButton.innerHTML = `
        <span class="loading">
            <span class="spinner"></span>
            Connexion...
        </span>
    `;


    try {

        const response = await fetch("/api/login", {

            method: "POST",

            headers: {
                "Content-Type": "application/json"
            },

            body: JSON.stringify({
                email: email,
                password: password
            })

        });


        let data;

        try {

            data = await response.json();

        } catch (error) {

            throw new Error(
                "Le serveur a retourné une réponse invalide."
            );

        }


        if (!response.ok || !data.success) {

            throw new Error(
                data.message || "E-mail ou mot de passe incorrect."
            );

        }


        /*
        ==============================================
        SAUVEGARDER LA SESSION
        ==============================================
        */

        localStorage.setItem(
            "school_token",
            data.token
        );


        localStorage.setItem(
            "school_user",
            JSON.stringify(data.user)
        );


        showMessage(
            "Connexion réussie. Ouverture du tableau de bord...",
            "success"
        );


        /*
        ==============================================
        REDIRECTION
        ==============================================
        */

        setTimeout(function() {

            window.location.href = "/admin.html";

        }, 700);


    } catch (error) {

        console.error(
            "Erreur de connexion :",
            error
        );


        showMessage(
            error.message ||
            "Impossible de se connecter au serveur.",
            "error"
        );


        loginButton.disabled = false;

        loginButton.textContent =
            "Se connecter";

    }

});

</script>

</body>
</html>
